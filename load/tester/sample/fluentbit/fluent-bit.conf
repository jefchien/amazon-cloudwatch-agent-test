[SERVICE]
    Flush                      5
    Grace                      30
    Log_Level                  error
    Daemon                     off
    Parsers_File               parsers.conf
    storage.path               /var/fluent-bit/state/flb-storage/
    storage.sync               normal
    storage.checksum           off
    storage.backlog.mem_limit  5M

[INPUT]
    Name                       tail
    Path                       /home/ec2-user/loadtest/testdata/test*
    Tag                        test_logs
    Parser                     log_parser
    DB                         /var/fluent-bit/state/flb_test_log.db
    Mem_Buf_Limit              50MB
    Skip_Long_Lines            On
    Refresh_Interval           10
    Rotate_Wait                30
    storage.type               filesystem
    Read_from_Head             true

[INPUT]
    Name                       tail
    Path                       /home/ec2-user/loadtest/testdata/other*
    Tag                        other_logs
    Parser                     log_parser
    DB                         /var/fluent-bit/state/flb_other_log.db
    Mem_Buf_Limit              50MB
    Skip_Long_Lines            On
    Refresh_Interval           10
    Rotate_Wait                30
    storage.type               filesystem
    Read_from_Head             true

[OUTPUT]
    Name                       cloudwatch_logs
    Match                      test_logs
    region                     us-east-1
    log_group_name             BenchmarkFluentBit
    log_stream_name            TestLog
    log_retention_days         1
    auto_create_group          true
    workers                    1

[OUTPUT]
    Name                       cloudwatch_logs
    Match                      other_logs
    region                     us-east-1
    log_group_name             BenchmarkFluentBit
    log_stream_name            OtherLog
    log_retention_days         1
    auto_create_group          true
    workers                    1
